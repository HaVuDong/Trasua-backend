version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trasua_backend
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/trasua?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - redis
      - minio
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: trasua_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: trasua_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: trasua_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  mongodb_data:
  minio_data:
